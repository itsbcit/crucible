# Runs the minitest suite (ruby test/all.rb). Releases are still cut by hand;
# see AGENTS.md.
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.0 matches the woodpecker-crucible image consumers build with.
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: ${{ matrix.ruby }}
      # Bundled gems, but not guaranteed in every Ruby build; the pipeline
      # tests shell out to rake.
      - run: gem install --no-document minitest rake
      - run: ruby test/all.rb
